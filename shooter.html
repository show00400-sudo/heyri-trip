<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>대장오리 & 카피바라 슈팅</title>
<style>
  html,body{margin:0;height:100%;background:#1b2238;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:auto;background:#000;border-radius:6px}
  #pad{position:fixed;inset:0;pointer-events:none;display:none}
  .touch #pad{display:block}
  .b{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:rgba(255,248,232,.55);border:3px solid rgba(233,211,168,.95);color:#4a3320;font:700 18px "Malgun Gothic",sans-serif;display:flex;align-items:center;justify-content:center;width:74px;height:74px}
  .b.dn{background:rgba(242,169,59,.95);color:#fff}
  #bL{left:16px;bottom:22px}#bR{left:104px;bottom:22px}
  #bJ{right:112px;bottom:22px;width:84px;height:84px}#bS{right:16px;bottom:44px;width:92px;height:92px;font-size:20px}
  #bU{left:60px;bottom:104px;width:60px;height:60px}
  #bP{right:12px;top:12px;width:46px;height:46px;font-size:16px}
  #back{position:fixed;left:10px;top:8px;z-index:4;color:#fff6dc;font:700 13px "Malgun Gothic",sans-serif;text-decoration:none;background:rgba(0,0,0,.35);padding:5px 10px;border-radius:12px}
  #rot{position:fixed;left:0;right:0;top:0;padding:8px;text-align:center;background:#f2a93b;color:#fff;font:700 14px "Malgun Gothic",sans-serif;display:none;z-index:5}
  @media (orientation:portrait){.touch #rot{display:block}.touch #back{top:44px}.touch #bP{top:50px}}
</style>
</head>
<body>
<a id="back" href="index.html">🏘 3D 마을 탐방</a>
<div id="rot">📱 가로로 돌리면 더 크게 즐길 수 있어요</div>
<div id="wrap"><canvas id="g"></canvas></div>
<div id="pad">
  <div class="b" id="bL">◀</div><div class="b" id="bR">▶</div><div class="b" id="bU">▲</div>
  <div class="b" id="bJ">점프</div><div class="b" id="bS">발사</div><div class="b" id="bP">❚❚</div>
</div>
<script>
'use strict';
/* =====================================================================
   대장오리 & 카피바라 — 2D jump & shoot.   (all art is drawn with canvas shapes)
   ===================================================================== */
const W = 960, H = 540, GY = 450;                 // logical size, ground top
const cv = document.getElementById('g'), ctx = cv.getContext('2d');
const TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (TOUCH) document.documentElement.classList.add('touch');
let SC = 1;
function fit() {
  const dpr = Math.min(devicePixelRatio || 1, 2), s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); SC = s * dpr;
}
addEventListener('resize', fit); fit();

/* ---------- utils ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ell = (x, y, rx, ry, fill, rot = 0) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fillStyle = fill; ctx.fill(); };
const poly = (pts, fill) => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
const rrect = (x, y, w, h, r, fill) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); };
const txt = (s, x, y, size, color, align = 'center', stroke) => { ctx.font = `bold ${size}px "Malgun Gothic",sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle'; if (stroke) { ctx.lineWidth = 5; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); } ctx.fillStyle = color; ctx.fillText(s, x, y); };

/* ---------- audio ---------- */
let AC;
function tone(f0, f1, dur, type = 'square', vol = .08, delay = 0) {
  try {
    AC ??= new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) { }
}
function noise(dur, vol = .12, f = 1800) {
  try {
    AC ??= new (window.AudioContext || window.webkitAudioContext)(); const n = AC.sampleRate * dur | 0, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(); fl.type = 'lowpass'; fl.frequency.value = f; g.gain.value = vol; s.buffer = b; s.connect(fl).connect(g).connect(AC.destination); s.start();
  } catch (e) { }
}
const sfx = {
  shoot: () => tone(900, 380, .08, 'square', .04), jump: () => tone(320, 700, .14, 'sine', .08), hit: () => tone(240, 120, .07, 'square', .05),
  kill: () => { noise(.18, .12, 1400); tone(500, 120, .18, 'sawtooth', .06); }, hurt: () => { tone(260, 70, .3, 'sawtooth', .1); noise(.15, .08); },
  coin: () => { tone(1040, 1040, .08, 'sine', .08); tone(1560, 1560, .12, 'sine', .08, .07); }, power: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, f, .12, 'triangle', .09, i * .07)),
  boom: () => { noise(.7, .22, 900); tone(160, 40, .6, 'sawtooth', .12); }, win: () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, f, .22, 'triangle', .1, i * .1)),
  warn: () => { tone(220, 220, .25, 'sawtooth', .1); tone(220, 220, .25, 'sawtooth', .1, .35); }
};

/* ---------- input ---------- */
const inp = { left: 0, right: 0, up: 0, jump: 0, shoot: 0, jumpP: 0, startP: 0, pauseP: 0 };
const KEY = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', Space: 'jump', KeyZ: 'jump', KeyK: 'jump', KeyX: 'shoot', KeyJ: 'shoot', ControlLeft: 'shoot', Enter: 'start' };
addEventListener('keydown', e => {
  const k = KEY[e.code]; if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'KeyP' || e.code === 'Escape') { if (!e.repeat) inp.pauseP = 1; return; }
  if (!k) return; if (k === 'start') { if (!e.repeat) inp.startP = 1; return; }
  if (k === 'jump' && !inp.jump) inp.jumpP = 1; inp[k] = 1; if (k === 'shoot' || k === 'jump') inp.startP = 1; wake();
});
addEventListener('keyup', e => { const k = KEY[e.code]; if (k && k !== 'start') inp[k] = 0; });
function wake() { try { AC ??= new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { } }
function bindBtn(id, key, extra) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('dn'); if (key === 'jump' && !inp.jump) inp.jumpP = 1; if (key) inp[key] = 1; extra && extra(); inp.startP = 1; wake(); });
  const up = () => { el.classList.remove('dn'); if (key) inp[key] = 0; };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
bindBtn('bL', 'left'); bindBtn('bR', 'right'); bindBtn('bU', 'up'); bindBtn('bJ', 'jump'); bindBtn('bS', 'shoot'); bindBtn('bP', null, () => inp.pauseP = 1);
cv.addEventListener('pointerdown', () => { inp.startP = 1; wake(); });

/* ---------- stages ---------- */
const STAGES = [
  { name: 'STAGE 1', title: '파주영어마을 정문 돌파!', theme: 'eng', len: 7000, bossX: 6000, boss: 'crowking', foes: ['slime', 'slime', 'crow', 'rat'], seed: 11 },
  { name: 'STAGE 2', title: '헤이리 예술마을 대소동!', theme: 'heyri', len: 7600, bossX: 6600, boss: 'ratking', foes: ['slime', 'crow', 'rat', 'cloud', 'cloud'], seed: 23 }
];
const PAL = {
  eng: { sky1: '#8fd0f5', sky2: '#e9f4ff', top: '#b5654d', top2: '#9c523f', dirt: '#6b4636', dirt2: '#5a3a2d', block: '#e3cf9c', block2: '#c9b27a' },
  heyri: { sky1: '#f7a96f', sky2: '#ffe3b8', top: '#74b95b', top2: '#5fa24a', dirt: '#7a5638', dirt2: '#684a31', block: '#c99a63', block2: '#a97b47' }
};
function buildLevel(si) {
  const st = STAGES[si], R = mulberry(st.seed), L = { solids: [], plats: [], gaps: [], foes: [], items: [], checks: [], st };
  let x = 720; const coinArc = (cx, cy, n) => { for (let i = 0; i < n; i++) L.items.push({ t: 'coin', x: cx + (i - (n - 1) / 2) * 34, y: cy - Math.sin(i / (n - 1 || 1) * Math.PI) * 50 }); };
  const addFoe = (t, fx, fy) => L.foes.push({ t, x: fx, y: fy });
  while (x < st.bossX - 520) {
    const r = R();
    if (r < .2) {                                                  // pit
      const w = 110 + R() * 70 | 0; L.gaps.push([x, x + w]);
      if (R() < .6) L.plats.push({ x: x + w / 2 - 50, y: GY - 80 - R() * 30, w: 100 });
      coinArc(x + w / 2, GY - 150, 5); x += w + 300 + R() * 160;
    } else if (r < .4) {                                           // crates
      const n = 1 + (R() < .5 ? 1 : 0); L.solids.push({ x, y: GY - 56 * n, w: 56 + (R() < .4 ? 56 : 0), h: 56 * n, crate: 1 });
      addFoe(pick(R, st.foes), x + 240, GY - 40); coinArc(x + 28, GY - 56 * n - 40, 3); x += 360 + R() * 140;
    } else if (r < .66) {                                          // floating platforms
      const y1 = GY - 95 - R() * 25, w = 150 + R() * 80;
      L.plats.push({ x, y: y1, w }); if (R() < .6) L.plats.push({ x: x + w + 70, y: y1 - 85, w: 130 });
      if (R() < .7) addFoe('rat', x + w / 2 - 20, y1 - 46); coinArc(x + w / 2, y1 - 40, 4);
      if (R() < .25) L.items.push({ t: pick(R, ['coffee', 'heart']), x: x + w / 2, y: y1 - 90 });
      addFoe(pick(R, st.foes), x + w + 200, GY - 40); x += w + 330 + R() * 120;
    } else {                                                       // enemy pack
      const n = 2 + (R() * 2 | 0); for (let i = 0; i < n; i++) addFoe(pick(R, st.foes), x + i * (150 + R() * 80), GY - 40);
      if (R() < .35) L.items.push({ t: pick(R, ['coffee', 'heart']), x: x + 160, y: GY - 150 }); x += n * 180 + 260 + R() * 100;
    }
  }
  L.checks = [Math.floor(st.bossX * .38), Math.floor(st.bossX * .7)];
  // ground rectangles between pits
  const gaps = L.gaps.sort((a, b) => a[0] - b[0]); let gx = -400;
  for (const [a, b] of gaps) { L.solids.push({ x: gx, y: GY, w: a - gx, h: 300, ground: 1 }); gx = b; }
  L.solids.push({ x: gx, y: GY, w: st.len + 600 - gx, h: 300, ground: 1 });
  // keep enemies off pits
  L.foes = L.foes.filter(f => f.t === 'crow' || f.t === 'cloud' || !gaps.some(([a, b]) => f.x > a - 40 && f.x < b + 40) || f.y < GY - 60);
  return L;
}
function pick(R, a) { return a[Math.min(a.length - 1, R() * a.length | 0)]; }

/* ---------- parallax backgrounds (pre-rendered) ---------- */
const TW = 1920;
function makeBG(theme) {
  const R = mulberry(theme === 'eng' ? 5 : 9), out = {};
  const mk = (h, fn) => { const c = document.createElement('canvas'); c.width = TW; c.height = h; const g = c.getContext('2d'); fn(g); return c; };
  out.far = mk(H, g => {
    for (let i = 0; i < 9; i++) { const cx = R() * TW, cy = 60 + R() * 160, s = .8 + R() * .9; g.fillStyle = 'rgba(255,255,255,.85)'; for (const [dx, dy, r] of [[0, 0, 30], [30, 8, 24], [-30, 8, 22], [10, -14, 22]]) { g.beginPath(); g.arc(cx + dx * s, cy + dy * s, r * s, 0, 7); g.fill(); } }
    g.fillStyle = theme === 'eng' ? '#a9d8b4' : '#e0a37d'; g.beginPath(); g.moveTo(0, 450); for (let x = 0; x <= TW; x += 40) g.lineTo(x, 380 - Math.sin(x / TW * 6.283 * 2) * 30 - Math.sin(x / TW * 6.283 * 5) * 14); g.lineTo(TW, 450); g.fill();
  });
  out.mid = mk(H, g => {
    const base = 452; let x = 20;
    const merlons = (x0, y0, w, h, col) => { g.fillStyle = col; for (let m = 0; m < w; m += h * 1.8) g.fillRect(x0 + m, y0 - h, h, h); };
    if (theme === 'eng') {
      while (x < TW - 100) {
        const k = R(), w = 150 + R() * 120;
        if (k < .3) {                                           // sandstone hall with pediment + dome
          g.fillStyle = '#d9c391'; g.fillRect(x, base - 150, w, 150); g.fillStyle = '#c9b27a'; g.fillRect(x, base - 158, w, 10);
          g.fillStyle = '#e9d6a6'; g.beginPath(); g.moveTo(x + w * .25, base - 158); g.lineTo(x + w * .5, base - 192); g.lineTo(x + w * .75, base - 158); g.fill();
          g.fillStyle = '#9db3a2'; g.beginPath(); g.arc(x + w / 2, base - 158, w * .16, Math.PI, 0); g.fill(); g.fillRect(x + w / 2 - 2, base - 158 - w * .16 - 18, 4, 18);
          for (let i = 0; i < 5; i++) { g.fillStyle = '#6f8aa0'; g.beginPath(); g.roundRect(x + 14 + i * (w - 28) / 5, base - 120, 14, 36, [7, 7, 0, 0]); g.fill(); g.beginPath(); g.roundRect(x + 14 + i * (w - 28) / 5, base - 70, 14, 36, [7, 7, 0, 0]); g.fill(); }
        } else if (k < .6) {                                    // castle wall + round tower
          g.fillStyle = '#dccfa8'; g.fillRect(x, base - 90, w, 90); merlons(x, base - 90, w, 14, '#dccfa8');
          g.fillStyle = '#e6dcc0'; g.beginPath(); g.roundRect(x + w - 70, base - 170, 64, 170, 6); g.fill(); merlons(x + w - 70, base - 170, 64, 14, '#e6dcc0');
          g.fillStyle = '#4a4a4a'; g.fillRect(x + w - 44, base - 130, 6, 24); g.fillRect(x + w - 44, base - 80, 6, 24);
          g.fillStyle = 'rgba(0,0,0,.08)'; for (let r2 = 0; r2 < 6; r2++) g.fillRect(x, base - 90 + r2 * 15, w, 2);
        } else {                                                // red-brick dorm with stepped gables
          g.fillStyle = '#b5543f'; g.fillRect(x, base - 120, w, 120); g.fillStyle = '#efdcae'; g.fillRect(x, base - 160, w, 40);
          for (let i = 0; i < 3; i++) { const gx = x + 12 + i * (w - 24) / 3; for (let s2 = 0; s2 < 3; s2++) { g.fillStyle = '#efdcae'; g.fillRect(gx + s2 * 5, base - 160 - (s2 + 1) * 9, (w - 24) / 3 - 22 - s2 * 10, 9); } }
          for (let i = 0; i < 4; i++) { g.fillStyle = '#7a9bb3'; g.fillRect(x + 14 + i * (w - 28) / 4, base - 105, 14, 24); g.fillRect(x + 14 + i * (w - 28) / 4, base - 60, 14, 24); }
        }
        x += w + 20 + R() * 50;
      }
    } else {
      while (x < TW - 100) {
        const k = R(), w = 120 + R() * 110, h = 110 + R() * 90;
        const pal = [['#f2f2ee', '#8aa6b8'], ['#e8b04a', '#fff3d6'], ['#4aa3a0', '#e6f7f5'], ['#d9604a', '#ffe3dc'], ['#c9c9c4', '#7a9bb3']][R() * 5 | 0];
        g.fillStyle = pal[0]; g.fillRect(x, base - h, w, h); g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x - 4, base - h - 6, w + 8, 8);
        if (k < .5) { g.fillStyle = pal[1]; g.fillRect(x + 10, base - h + 16, w - 20, h * .5); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(x + 10, base - h + 16, (w - 20) / 2, h * .5); }
        else { g.fillStyle = '#b5543f'; g.beginPath(); g.moveTo(x - 6, base - h); g.lineTo(x + w / 2, base - h - 46); g.lineTo(x + w + 6, base - h); g.fill(); g.fillStyle = pal[1]; for (let i = 0; i < 3; i++) g.fillRect(x + 14 + i * (w - 28) / 3, base - h + 20, 18, 30); g.fillStyle = '#8a4b3a'; g.fillRect(x + w * .7, base - h - 52, 14, 30); }
        g.fillStyle = '#5b4636'; g.fillRect(x + w / 2 - 9, base - 42, 18, 42);
        g.fillStyle = '#fff6dc'; g.fillRect(x + w * .1, base - h * .3, w * .35, 14);
        x += w + 16 + R() * 40;
      }
    }
  });
  out.near = mk(H, g => {
    let x = 30;
    while (x < TW) {
      const k = R();
      if (k < .4) { g.fillStyle = '#2e3a3a'; g.fillRect(x, 380, 6, 74); g.fillStyle = '#fff1c4'; g.beginPath(); g.arc(x + 3, 376, 9, 0, 7); g.fill(); }
      else if (k < .75) { g.fillStyle = theme === 'eng' ? '#4f8f45' : '#5a9a4a'; g.beginPath(); g.roundRect(x, 424, 70 + R() * 50, 30, 14); g.fill(); }
      else { g.fillStyle = '#6b4a2e'; g.fillRect(x + 20, 390, 10, 64); g.fillStyle = theme === 'eng' ? '#5a9a4a' : '#e08a3a'; g.beginPath(); g.arc(x + 25, 385, 34, 0, 7); g.fill(); g.beginPath(); g.arc(x + 4, 400, 24, 0, 7); g.fill(); g.beginPath(); g.arc(x + 46, 400, 24, 0, 7); g.fill(); }
      x += 90 + R() * 160;
    }
  });
  return out;
}
const BG = { eng: makeBG('eng'), heyri: makeBG('heyri') };

/* ---------- character drawing ---------- */
function drawDuck(x, y, s, t, o = {}) {              // 대장오리 (side view)
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const fl = o.flap ? Math.sin(t * 40) * .6 : Math.sin(t * 4) * .08, wob = Math.sin(t * 5) * 1.2;
  // cape
  ctx.beginPath(); ctx.moveTo(-9, -9); const cw = Math.sin(t * 7) * 3 + (o.run ? 6 : 0); ctx.quadraticCurveTo(-26 - cw, -2, -30 - cw * 1.4, 14 + cw * .4); ctx.lineTo(-10, 12); ctx.closePath(); ctx.fillStyle = '#d9283d'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30 - cw * 1.4, 14 + cw * .4); ctx.lineTo(-10, 12); ctx.lineWidth = 3; ctx.strokeStyle = '#fffaf0'; ctx.stroke();
  ell(0, 0, 16, 15, '#ffdf4d'); ell(2, 4, 9, 8, '#fff2a6');                       // body + belly
  ell(-15, 3, 5, 4, '#ffdf4d', -.4);                                              // tail
  ell(7, -17 + wob * .2, 13, 12, '#ffdf4d');                                      // head
  for (const [dx, dy, r] of [[-1, -30, 3.4], [4, -32, 3.6], [9, -30, 3.2]]) ell(dx, dy, r * .8, r * 1.6, '#ffd12e', .3);   // tuft
  ell(13, -19, 3.6, 4.4, '#15100a'); ell(14.2, -20.6, 1.3, 1.3, '#fff');          // eye
  ell(15, -11.5, 4.2, 3, '#ff9fb2');                                              // cheek
  ell(21, -14, 6, 3.4, '#ff9a2e'); ell(21, -11.4, 5, 2.2, '#ff8618');             // beak
  ctx.save(); ctx.translate(-2, 1); ctx.rotate(fl); ell(-2, 2, 9, 5, '#ffd12e', .4); ctx.restore();   // wing
  // crown
  ctx.fillStyle = '#ffc928'; ctx.beginPath(); ctx.moveTo(1, -27); ctx.lineTo(1, -33); ctx.lineTo(4, -30); ctx.lineTo(7, -35); ctx.lineTo(10, -30); ctx.lineTo(13, -33); ctx.lineTo(13, -27); ctx.closePath(); ctx.fill();
  ell(7, -29, 1.6, 1.6, '#ff4d6d');
  ctx.restore();
}
function drawCapy(x, y, t, run, air) {                  // 카피바라 — (x, y) = bottom center, facing +x
  ctx.save(); ctx.translate(x, y);
  const ph = t * 16, sw = run ? Math.sin(ph) * 7 : 0;
  for (const [lx, p] of [[-20, 0], [-10, Math.PI], [12, Math.PI], [22, 0]]) { const s2 = air ? -3 : Math.sin(ph + p) * 7 * (run ? 1 : 0); rrect(lx - 5 + s2 * .3, -14, 10, 14 + (air ? -4 : 0), 4, '#6b4426'); }
  ell(0, -26, 36, 22, '#b07a45'); ell(-4, -20, 26, 12, '#bd8a55');                 // body
  ell(-35, -26, 6, 6, '#6b4426');                                                 // tail
  ell(30, -34 + Math.sin(ph) * (run ? 1 : 0), 18, 16, '#b07a45');                 // head
  ell(46, -29, 12, 9.5, '#d9b383'); ell(54, -33, 4.4, 3.2, '#2b1a10');            // snout + nose
  ell(38, -41, 2.8, 2.8, '#1d130c'); ell(39, -42, 1, 1, '#fff');                  // eye
  ell(24, -49, 5, 4, '#6b4426', -.3);                                             // ear
  ell(36, -22, 5, 3, '#c4915b');                                                  // cheek fluff

let coins = 0;
function updateBoss(dt) {

    else if (b.state === 'toss') { if (b.st > .5 && !b.shot) { b.shot = 1; for (const k of enr > 1 ? [-.25, .1, .4] : [0]) ebul.push({ x: b.x + b.w / 2, y: b.y, vx: b.dir * (260 + k * 400) , vy: -560 - k * 200, r: 11, k: 'cheese', life: 4 }); sfx.hit(); } if (b.st > 1.1) { b.state = 'walk'; b.shot = 0; b.cd = 1.2 / enr; } }

/* ---------- render ---------- */
function drawBG(t) {

}
function drawWorld(t) {
  const pal = PAL[lvl.st.theme];

      else { ctx.fillStyle = pal.top; ctx.fillRect(s.x, s.y, s.w, 16); ctx.fillStyle = pal.top2; for (let x = Math.floor(s.x / 22) * 22; x < s.x + s.w; x += 22) ctx.fillRect(Math.max(x, s.x), s.y + 12, 8, 8); }
    } else {

function overlayText(a, b, c) { ctx.fillStyle = 'rgba(15,20,40,.62)'; ctx.fillRect(0, 0, W, H); txt(a, W / 2, H / 2 - 50, 52, '#fff6dc', 'center', '#3a2a18'); if (b) txt(b, W / 2, H / 2 + 8, 24, '#ffe9b8', 'center', '#3a2a18'); if (c) txt(c, W / 2, H / 2 + 56, 20, '#fff', 'center', '#3a2a18'); }
function render(dt) {

  if (bossIntro > 0) { ctx.globalAlpha = Math.abs(Math.sin(tAll * 8)) * .9 + .1; txt('⚠ WARNING ⚠', W / 2, 200, 54, '#ff4d4d', 'center', '#300'); ctx.globalAlpha = 1; }

function drawWorldTitle(t) {

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {

requestAnimationFrame(frame);
window.__g = { sim(n) { for (let i = 0; i < n; i++) { if (state === 'play' || state === 'dead' || state === 'clear') update(1 / 60); } render(0); }, get state() { return state; }, get P() { return P; }, get boss() { return boss; }, inp, get foes() { return foes; }, get lvl() { return lvl; }, startStage, cam, get lockX() { return lockX; } };
