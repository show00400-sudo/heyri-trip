<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>헤이리 오리·카피바라 여행</title>
<style>
  :root{--ink:#4a3320;--paper:#fff8e8;--accent:#f2a93b;--leaf:#6fae5c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd8f5;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .panel{background:rgba(255,248,232,.9);border:2px solid #e9d3a8;border-radius:16px;box-shadow:0 4px 14px rgba(80,50,10,.18)}
  #hud{position:fixed;inset:0;pointer-events:none}
  #stats{position:absolute;left:12px;top:12px;padding:8px 12px;font-weight:700;line-height:1.6;font-size:14px}
  #stats small{font-weight:400;opacity:.7}
  #mission{position:absolute;left:12px;top:100px;padding:10px 14px;max-width:270px;font-size:14px;line-height:1.5}
  #mission .t{font-weight:700;color:#c9731a}
  #mission .s{margin-top:2px}
  #mission .d{margin-top:4px;font-size:12px;opacity:.75}
  #ctrl{position:absolute;right:12px;top:12px;padding:6px;display:flex;gap:5px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:340px}
  #ctrl button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:2px solid #e9d3a8;border-radius:10px;padding:6px 9px;cursor:pointer}
  #ctrl button:hover,#ctrl button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #mini{position:absolute;right:12px;bottom:12px;width:200px;padding:4px}
  #mini canvas{width:100%;display:block;border-radius:12px}
  #help{position:absolute;left:12px;bottom:12px;padding:8px 12px;font-size:12.5px;line-height:1.6;max-width:min(400px,calc(100vw - 240px))}
  #arrowWrap{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:6px 16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
  #arrow{display:inline-block;font-size:26px;color:#e8453c;line-height:1;transition:transform .08s linear}
  #dlg{position:absolute;left:50%;bottom:26%;transform:translate(-50%,12px);width:min(560px,calc(100vw - 24px));padding:12px 16px;opacity:0;transition:.3s;pointer-events:auto}
  #dlg.show{opacity:1;transform:translate(-50%,0)}
  #dlg .who{font-weight:700;color:#c9731a;font-size:14px}
  #dlg .en{font-size:18px;font-weight:700;margin-top:3px;line-height:1.35}
  #dlg .ko{font-size:14px;margin-top:3px;opacity:.8}
  #toast{position:absolute;left:50%;top:20%;transform:translate(-50%,-10px);padding:14px 22px;text-align:center;opacity:0;transition:.4s;font-weight:700;max-width:90vw}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast .sub{font-weight:400;font-size:14px;margin-top:4px}
  #intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#bfe6f7e6,#fff2cfee);z-index:5;padding:12px}
  #intro .card{max-width:500px;padding:24px 26px;text-align:center}
  #intro h1{margin:0 0 6px;font-size:26px}
  #intro p{margin:6px 0;line-height:1.6;font-size:15px}
  #intro button{margin-top:14px;font:inherit;font-size:18px;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:14px;padding:12px 32px;cursor:pointer}
  #intro button:disabled{opacity:.5;cursor:wait}
  /* touch controls */
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  .touch #touch{display:block}
  #stick{position:absolute;left:22px;bottom:30px;width:130px;height:130px;border-radius:50%;background:rgba(255,248,232,.45);border:3px solid rgba(233,211,168,.9);pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(242,169,59,.9);box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .tb{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(255,248,232,.85);border:3px solid #e9d3a8;font:700 14px "Malgun Gothic",sans-serif;color:var(--ink);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center}
  .tb.down{background:var(--accent);color:#fff}
  #tbJump{right:22px;bottom:150px}
  #tbRun{right:96px;bottom:90px}
  .hide-hud #hud,.hide-hud #touch{display:none}
  .touch #help{display:none}
  .touch #dlg{bottom:34%}
  @media (max-width:640px){
    #help,#stats{display:none}
    #arrowWrap{left:10px;transform:none;top:10px;padding:4px 10px;font-size:12px;max-width:calc(100vw - 190px)}
    #arrow{font-size:20px}
    #mission{left:10px;top:54px;max-width:calc(100vw - 150px);font-size:12px;padding:8px 10px}
    #ctrl{max-width:170px;top:10px;right:10px;padding:4px}
    #ctrl button{padding:4px 7px;font-size:12px}
    #mini{width:110px;top:142px;bottom:auto;right:10px}
    #dlg{bottom:30%}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="stats" class="panel"></div>
  <div id="mission" class="panel"></div>
  <div id="arrowWrap" class="panel"><span id="arrow">➤</span><span id="target"></span></div>
  <div id="ctrl" class="panel">
    <button id="bSwap" title="Tab">🦆↔🐹</button>
    <button data-t="0">☀</button><button data-t="1">🌇</button><button data-t="2">🌙</button>
    <button id="bGuide" title="자동 길안내">🧭</button>
    <button id="bTilt" title="기울이기 조작">📱</button>
    <button id="bFull" title="전체화면">⛶</button>
    <button id="bPhoto" title="P">📷</button>
    <button id="bReset" title="미션 처음부터">↺</button>
  </div>
  <div id="help" class="panel"><b>WASD/방향키</b> 이동 · <b>Shift</b> 달리기 · <b>Space</b> 점프(오리는 길게 눌러 활공)<br><b>마우스 드래그</b> 시점 · <b>휠</b> 줌 · <b>Tab</b> 오리/카피바라 교대 · <b>P</b> 사진 · <b>클릭/Enter</b> 대화 넘기기<br><b>바닥 클릭·탭</b> 그곳으로 이동 · <b>🧭</b> 자동 길안내</div>
  <div id="mini" class="panel"><canvas id="mm"></canvas></div>
  <div id="dlg" class="panel"><div class="who"></div><div class="en"></div><div class="ko"></div></div>
  <div id="toast" class="panel"></div>
</div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div class="tb" id="tbJump">점프</div>
  <div class="tb" id="tbRun">달리기</div>
</div>
<div id="intro"><div class="card panel">
  <h1>🦆 파주영어마을 여행 🐹</h1>
  <p>카피바라 머리 위에 올라탄 대장오리와 함께<br><b>파주영어마을</b>과 <b>헤이리 예술마을</b>을 돌아다니며 심부름을 해요.</p>
  <p>미션 1 · 정문 ↔ 본관 심부름<br>미션 2 · 헤이리 마을에서 커피 사오기</p>
  <p style="font-size:12px;opacity:.7">지도는 OpenStreetMap 실제 도로·부지 경계 기반</p>
  <button id="start" disabled>불러오는 중…</button>
</div></div>

<script src="map.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="game.js"></script>
</body>
</html>
